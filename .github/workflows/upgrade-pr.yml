# SPDX-License-Identifier: CC0-1.0
name: Upgrade Temml if possible
on:
  schedule:
    - cron: '30 18 * * 4'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Temml version'
jobs:
  pr:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          bundler-cache: true
          ruby-version: '3.4'
      - name: Check versions
        id: check_versions
        run: |
          current_version="$(grep TEMML_VERSION lib/temml/version.rb | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -n "${{ github.event.inputs.target_version }}" ]; then
            upstream_version="${{ github.event.inputs.target_version }}"
          else
            upstream_version="$(curl -sL https://api.github.com/repos/ronkok/Temml/releases/latest | jq -r '.tag_name' | sed 's/^v//')"
          fi
          newer_version="$(printf '%s\n%s\n' "$current_version" "$upstream_version" | sort -V | tail -n1)"
          if [ "$current_version" != "$upstream_version" ] && [ "$newer_version" = "$upstream_version" ]; then
            run_upgrade=true
            branch_name=upgrade-temml-to-"$newer_version"
          else
            run_upgrade=false
            branch_name=
          fi
          {
            echo "current_version=$current_version"
            echo "upstream_version=$upstream_version"
            echo "newer_version=$newer_version"
            echo "run_upgrade=$run_upgrade"
            echo "branch_name=$branch_name"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Import Temml assets
        if: steps.check_versions.outputs.run_upgrade == 'true'
        run: |
          bundle exec rake "update[${{ steps.check_versions.outputs.newer_version }}]"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.check_versions.outputs.run_upgrade == 'true'
        with:
          commit-message: rake update[${{ steps.check_versions.outputs.newer_version }}]
          branch: ${{ steps.check_versions.outputs.branch_name }}
          delete-branch: true
          title: Upgrade Temml to v${{ steps.check_versions.outputs.newer_version }}
          body: |
            Upgrade Temml to [v${{ steps.check_versions.outputs.newer_version }}](https://github.com/ronkok/Temml/releases/tag/v${{ steps.check_versions.outputs.newer_version }}).

            Don't forget to run the workflow!
            [![lint and test](https://github.com/sudotac/temml-ruby/actions/workflows/lint-and-test.yml/badge.svg?branch=${{ steps.check_versions.outputs.branch_name }})](https://github.com/sudotac/temml-ruby/actions/workflows/lint-and-test.yml?query=branch%3A${{ steps.check_versions.outputs.branch_name }})
          assignees: sudotac
          reviewers: sudotac
