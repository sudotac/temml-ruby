# SPDX-License-Identifier: CC0-1.0
name: Lint and test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  rubocop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['4.0', '3.4', '3.3']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby-version }}
      - uses: ./.github/actions/minify
      - name: Run Rubocop
        run: bundle exec rubocop

  rspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['4.0', '3.4', '3.3']
    env:
      COVERAGE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby-version }}
      - uses: ./.github/actions/minify
      - name: Run RSpec
        run: bundle exec rspec --format d

  gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: '3.4'
      - uses: ./.github/actions/minify
      - name: Build and install gem
        run: |
          gem build --verbose temml.gemspec
          gem install --verbose temml-*.gem
      - name: Run tests on installed gem
        run: |
          rm -rf bin/ lib/ vendor/ # make sure installed gem will be used
          gem install rspec nokogiri
          rspec --format d
